<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <meta name="theme-color" content="#10162c">
    <title>ESCAPE FROM THIRTIES</title>
    <script>
      (function () {
        function clamp(value, min, max) {
          return Math.min(max, Math.max(min, value));
        }

        function setAppLayout() {
          var viewport = window.visualViewport;
          var height = viewport ? viewport.height : window.innerHeight;
          var width = viewport ? viewport.width : window.innerWidth;
          if (!height) return;
          var controlHeight = clamp(height * 0.2, 96, 144);
          var statusHeight = clamp(height * 0.055, 34, 44);
          var gameHeight = Math.max(1, height - controlHeight - statusHeight - 32);
          var appWidth = Math.min(width || 480, (gameHeight * 360 / 520) + 20, 900);
          document.documentElement.style.setProperty("--app-height", Math.floor(height) + "px");
          document.documentElement.style.setProperty("--app-width", Math.floor(appWidth) + "px");
        }
        setAppLayout();
        window.addEventListener("resize", setAppLayout);
        if (window.visualViewport) {
          window.visualViewport.addEventListener("resize", setAppLayout);
          window.visualViewport.addEventListener("scroll", setAppLayout);
        }
      })();
    </script>
    <link rel="stylesheet" href="styles.css?v=20260830-hidden-menu-pulse">
  </head>
  <body>
    <main class="app" aria-label="ESCAPE FROM THIRTIES MVP">
      <section class="game-panel" aria-label="ゲーム画面">
        <canvas id="gameCanvas" width="360" height="520"></canvas>
      </section>

      <section class="status-bar" aria-live="polite">
        <div class="status-score"><span>SCORE</span><strong id="scoreLabel">0</strong></div>
        <div class="status-life"><span>LIFE</span><strong id="lifeLabel">♥♥♥</strong></div>
      </section>

      <section id="titleScreen" class="screen title-screen main-title-screen">
        <div class="title-stack">
          <div class="title-logo">
            <div class="title-logo-mark">
              <img class="title-logo-image" src="assets/ui/title_logo_normal.png" alt="ESCAPE FROM THIRTIES">
            </div>
            <p>みりたん2026</p>
          </div>
          <nav class="title-menu" aria-label="Title menu">
            <button id="startButton" class="title-menu-item title-menu-main" type="button">START</button>
            <button id="storyButton" class="title-menu-item title-menu-sub" type="button">STORY</button>
            <button id="creditsButton" class="title-menu-item title-menu-sub" type="button">CREDITS</button>
            <button id="consoleButton" class="title-menu-item title-menu-hidden" type="button">HIDDEN?</button>
          </nav>
        </div>
      </section>

      <section id="consoleScreen" class="screen console-screen" hidden>
        <header>
          <h2>CONSOLE</h2>
          <button id="consoleBackButton" class="small-action" type="button">BACK</button>
        </header>
        <div class="console-device">
          <div class="console-artboard">
            <img class="console-body-image" src="assets/ui/console_body.png" alt="" aria-hidden="true">
            <div id="consoleDisplay" class="console-display">&gt; COMMAND?</div>
            <button data-console-input="UP" class="console-hit console-hit-up" type="button" aria-label="UP"></button>
            <button data-console-input="LEFT" class="console-hit console-hit-left" type="button" aria-label="LEFT"></button>
            <button data-console-input="RIGHT" class="console-hit console-hit-right" type="button" aria-label="RIGHT"></button>
            <button data-console-input="DOWN" class="console-hit console-hit-down" type="button" aria-label="DOWN"></button>
            <button data-console-input="B" class="console-hit console-hit-b" type="button" aria-label="B"></button>
            <button data-console-input="A" class="console-hit console-hit-a" type="button" aria-label="A"></button>
          </div>
        </div>
      </section>

      <section id="secretTitleScreen" class="screen title-screen secret-title-screen" hidden>
        <div class="title-stack">
          <div class="title-logo">
            <div class="title-logo-mark">
              <img class="title-logo-image" src="assets/ui/title_logo_normal.png" alt="ESCAPE FROM THIRTIES">
              <img class="secret-title-bdash" src="assets/ui/SIDEBDASH.png" alt="B-DASH">
            </div>
          </div>
          <nav class="title-menu" aria-label="Secret title menu">
            <button id="secretStartButton" class="title-menu-item title-menu-main" type="button">START</button>
            <button id="secretStoryButton" class="title-menu-item title-menu-sub" type="button">STORY</button>
            <button id="normalModeButton" class="title-menu-item title-menu-sub" type="button">NORMAL MODE</button>
          </nav>
        </div>
      </section>

      <section id="storyScreen" class="screen story-screen" hidden>
        <header>
          <h2>STORY</h2>
          <button id="storyBackButton" class="small-action" type="button">BACK</button>
        </header>
        <article id="storyBody" class="story-body"></article>
      </section>

      <section id="creditsScreen" class="screen credits-screen" hidden>
        <header>
          <h2>CREDITS</h2>
          <button id="creditsBackButton" class="small-action" type="button">BACK</button>
        </header>
        <article id="creditsBody" class="credits-body"></article>
      </section>

      <section id="resultScreen" class="screen result-screen" hidden>
        <div class="result-box">
          <p id="resultStatus" class="result-status">CLEAR</p>
          <dl>
            <div>
              <dt>TOTAL SCORE</dt>
              <dd id="resultScore">0</dd>
            </div>
            <div>
              <dt>REMAINING LIFE</dt>
              <dd id="resultLife">0</dd>
            </div>
            <div>
              <dt>ITEMS</dt>
              <dd id="resultItems">0</dd>
            </div>
          </dl>
          <div class="result-actions">
            <button id="retryButton" class="primary-action" type="button">RETRY</button>
            <button id="titleButton" class="secondary-action" type="button">TITLE</button>
          </div>
        </div>
      </section>

      <section class="controls" aria-label="操作ボタン">
        <button id="boostButton" class="control-button boost" type="button">Bだっしゅ</button>
        <button id="jumpButton" class="control-button jump" type="button">JUMP</button>
      </section>
    </main>

    <script src="config.js?v=20260826-window-even-spacing"></script>
    <script src="assets.js?v=20260829-item-biribiri-blink"></script>
    <script src="course.js?v=20260829-item-game-33"></script>
    <script src="story.js?v=20260826-secret-story-1"></script>
    <script src="credits.js?v=20260821-credits-sama"></script>
    <script src="main.js?v=20260829-item-frame-blink-fast"></script>
  </body>
</html>
