<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <meta name="theme-color" content="#10162c">
    <title>ESCAPE FROM THIRTIES</title>
    <script>
      (function () {
        function setAppHeight() {
          var viewport = window.visualViewport;
          var height = viewport ? viewport.height : window.innerHeight;
          if (!height) return;
          document.documentElement.style.setProperty("--app-height", Math.floor(height) + "px");
        }
        setAppHeight();
        window.addEventListener("resize", setAppHeight);
        if (window.visualViewport) {
          window.visualViewport.addEventListener("resize", setAppHeight);
          window.visualViewport.addEventListener("scroll", setAppHeight);
        }
      })();
    </script>
    <link rel="stylesheet" href="styles.css?v=20260817-font">
  </head>
  <body>
    <main class="app" aria-label="ESCAPE FROM THIRTIES MVP">
      <section class="game-panel" aria-label="ゲーム画面">
        <canvas id="gameCanvas" width="360" height="520"></canvas>
        <div class="hud" aria-live="polite">
          <div><span>SCORE</span><strong id="scoreLabel">0</strong></div>
          <div><span>LIFE</span><strong id="lifeLabel">3</strong></div>
          <div><span>Bだっしゅ</span><strong id="boostLabel">x1.0</strong></div>
        </div>
      </section>

      <section id="titleScreen" class="screen title-screen">
        <button id="storyButton" class="small-action" type="button">STORY</button>
        <button id="consoleButton" class="console-open" type="button">CONSOLE</button>
        <div class="title-logo">
          <span class="eyebrow">MVP TEMP BUILD</span>
          <h1>ESCAPE FROM THIRTIES</h1>
          <p>古川未鈴30代からの脱出!!</p>
        </div>
        <button id="startButton" class="primary-action" type="button">START</button>
      </section>

      <section id="consoleScreen" class="screen console-screen" hidden>
        <header>
          <h2>CONSOLE</h2>
          <button id="consoleBackButton" class="small-action" type="button">BACK</button>
        </header>
        <div class="console-device">
          <div id="consoleDisplay" class="console-display">READY</div>
          <div class="console-pad" aria-label="console input">
            <button data-console-input="UP" class="pad-button up" type="button">UP</button>
            <button data-console-input="LEFT" class="pad-button left" type="button">LEFT</button>
            <button data-console-input="RIGHT" class="pad-button right" type="button">RIGHT</button>
            <button data-console-input="DOWN" class="pad-button down" type="button">DOWN</button>
          </div>
          <div class="console-actions" aria-label="console action buttons">
            <button data-console-input="B" class="round-button b-button" type="button">B</button>
            <button data-console-input="A" class="round-button a-button" type="button">A</button>
          </div>
        </div>
      </section>

      <section id="secretTitleScreen" class="screen title-screen secret-title-screen" hidden>
        <button id="secretStoryButton" class="small-action" type="button">STORY</button>
        <div class="title-logo">
          <span class="eyebrow">SECRET MODE</span>
          <h1>みりんのハートにBダッシュ</h1>
        </div>
        <button id="secretStartButton" class="primary-action" type="button">START</button>
        <button id="normalModeButton" class="secondary-action" type="button">NORMAL MODE</button>
      </section>

      <section id="storyScreen" class="screen story-screen" hidden>
        <header>
          <h2>STORY</h2>
          <button id="storyBackButton" class="small-action" type="button">BACK</button>
        </header>
        <article id="storyBody" class="story-body"></article>
      </section>

      <section id="resultScreen" class="screen result-screen" hidden>
        <div class="result-box">
          <p id="resultStatus" class="result-status">CLEAR</p>
          <dl>
            <div>
              <dt>TOTAL SCORE</dt>
              <dd id="resultScore">0</dd>
            </div>
            <div>
              <dt>REMAINING LIFE</dt>
              <dd id="resultLife">0</dd>
            </div>
            <div>
              <dt>ITEMS</dt>
              <dd id="resultItems">0</dd>
            </div>
          </dl>
          <div class="result-actions">
            <button id="retryButton" class="primary-action" type="button">RETRY</button>
            <button id="titleButton" class="secondary-action" type="button">TITLE</button>
          </div>
        </div>
      </section>

      <section class="controls" aria-label="操作ボタン">
        <button id="boostButton" class="control-button boost" type="button">Bだっしゅ</button>
        <button id="jumpButton" class="control-button jump" type="button">JUMP</button>
      </section>
    </main>

    <script src="config.js?v=20260817-font"></script>
    <script src="assets.js?v=20260817-font"></script>
    <script src="course.js?v=20260817-font"></script>
    <script src="story.js?v=20260817-font"></script>
    <script src="main.js?v=20260817-font"></script>
  </body>
</html>
